name: Trigger auto deployment for containerapps-agent-whatsapp

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/containerapps-agent-whatsapp-AutoDeployTrigger-2d26c1b7-11af-4b44-bbbb-3d6259f7821a.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CONTAINERAPPSAGENTWHATSAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CONTAINERAPPSAGENTWHATSAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CONTAINERAPPSAGENTWHATSAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: acragentewhatsappvladimir.azurecr.io
          registryUsername: ${{ secrets.CONTAINERAPPSAGENTWHATSAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CONTAINERAPPSAGENTWHATSAPP_REGISTRY_PASSWORD }}
          containerAppName: containerapps-agent-whatsapp
          resourceGroup: rg-agent-whatsapp
          imageToBuild: acragentewhatsappvladimir.azurecr.io/containerapps-agent-whatsapp:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


